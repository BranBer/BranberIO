<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 630"
     role="img" aria-label="Brandon Berke — Full-Stack Developer who ships from frontend to infrastructure. branber.io">
  <defs>
    <!-- Mesh bokeh echoing mesh-bg-light.svg (same stops, repositioned for 1200x630) -->
    <radialGradient id="og-mA" cx="15%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#DCE6FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#DCE6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-mB" cx="88%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#E8DDFB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E8DDFB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-mC" cx="80%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#D8F0EC" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#D8F0EC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-mD" cx="30%" cy="108%" r="55%">
      <stop offset="0%" stop-color="#DCE6FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#DCE6FF" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted card fill: glass-strong light (white ~0.72) baked over the mesh -->
    <linearGradient id="og-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.66" />
    </linearGradient>

    <!-- Soft drop shadow approximating glass-shadow (0 8px 30px rgb(16 19 28 / 0.10)) -->
    <filter id="og-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#10131C" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Page base + mesh (the "out-of-focus imagery" behind the glass) -->
  <rect width="1200" height="630" fill="#F4F6FB" />
  <rect width="1200" height="630" fill="url(#og-mA)" />
  <rect width="1200" height="630" fill="url(#og-mB)" />
  <rect width="1200" height="630" fill="url(#og-mC)" />
  <rect width="1200" height="630" fill="url(#og-mD)" />

  <!-- ~50px outer mesh frame, then the frosted content card inside the 80px safe margin -->
  <g filter="url(#og-shadow)">
    <rect x="56" y="56" width="1088" height="518" rx="28" fill="url(#og-card)" />
    <!-- hairline glass border + top inner highlight -->
    <rect x="56.5" y="56.5" width="1087" height="517" rx="27.5"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1" />
    <rect x="57.5" y="57.5" width="1085" height="515" rx="26.5"
          fill="none" stroke="#10131C" stroke-opacity="0.06" stroke-width="1" />
  </g>

  <!-- ===== Content (all inside ~80px safe inset from the page edges) ===== -->

  <!-- Brand row: monogram chip + accent overline label -->
  <g transform="translate(96, 104)">
    <!-- monogram mark, echoing logo-monogram.svg, drawn in accent -->
    <g transform="translate(0,0)">
      <rect x="1.3" y="1.3" width="61.4" height="61.4" rx="16"
            fill="#FFFFFF" fill-opacity="0.55"
            stroke="#3B5BDB" stroke-width="3.4" />
      <path d="M22 19h12.6a8 8 0 0 1 0 16H22V19Zm0 16h13.8a8 8 0 0 1 0 16H22V35Z"
            fill="none" stroke="#3B5BDB" stroke-width="4" stroke-linejoin="round" />
    </g>
    <!-- overline -->
    <text x="84" y="27"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="700" letter-spacing="3.4"
          fill="#3B5BDB">FULL-STACK DEVELOPER</text>
    <text x="84" y="54"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="600" letter-spacing="0.2"
          fill="#5C6478">branber.io</text>
  </g>

  <!-- Primary: name (display) -->
  <text x="96" y="290"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="116" font-weight="800" letter-spacing="-2.4"
        fill="#10131C">Brandon Berke</text>

  <!-- Accent highlight rule under the name -->
  <rect x="100" y="320" width="132" height="8" rx="4" fill="#3B5BDB" />

  <!-- Secondary: headline. Split across two lines for thumbnail legibility,
       accent word "frontend to infrastructure" kept on its own line. -->
  <text x="96" y="404"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="44" font-weight="600" letter-spacing="-0.4"
        fill="#3A4154">Full-Stack Developer who ships</text>
  <text x="96" y="460"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="44" font-weight="600" letter-spacing="-0.4"
        fill="#3A4154">from <tspan fill="#10131C" font-weight="700">frontend</tspan> to <tspan fill="#10131C" font-weight="700">infrastructure</tspan></text>

  <!-- Footer: tech keyword chips (glass-chip feel, flat) -->
  <g transform="translate(96, 510)">
    <!-- React -->
    <rect x="0" y="0" width="118" height="44" rx="22"
          fill="#FFFFFF" fill-opacity="0.6" stroke="#10131C" stroke-opacity="0.10" stroke-width="1" />
    <circle cx="26" cy="22" r="4" fill="#3B5BDB" />
    <text x="42" y="29"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="600" fill="#3A4154">React</text>

    <!-- TypeScript -->
    <rect x="134" y="0" width="166" height="44" rx="22"
          fill="#FFFFFF" fill-opacity="0.6" stroke="#10131C" stroke-opacity="0.10" stroke-width="1" />
    <circle cx="160" cy="22" r="4" fill="#3B5BDB" />
    <text x="176" y="29"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="600" fill="#3A4154">TypeScript</text>

    <!-- AWS -->
    <rect x="320" y="0" width="104" height="44" rx="22"
          fill="#FFFFFF" fill-opacity="0.6" stroke="#10131C" stroke-opacity="0.10" stroke-width="1" />
    <circle cx="346" cy="22" r="4" fill="#3B5BDB" />
    <text x="362" y="29"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="600" fill="#3A4154">AWS</text>

    <!-- Terraform -->
    <rect x="444" y="0" width="156" height="44" rx="22"
          fill="#FFFFFF" fill-opacity="0.6" stroke="#10131C" stroke-opacity="0.10" stroke-width="1" />
    <circle cx="470" cy="22" r="4" fill="#3B5BDB" />
    <text x="486" y="29"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="20" font-weight="600" fill="#3A4154">Terraform</text>
  </g>
</svg>
