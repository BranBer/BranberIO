<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none"
     stroke="currentColor" color="currentColor" role="img"
     aria-labelledby="ccinfra-title ccinfra-desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="ccinfra-title">Cipher Codex AWS infrastructure — minimal Terraform stack</title>
  <desc id="ccinfra-desc">A clean, minimal Infrastructure-as-Code diagram. A four-file Terraform stack
    (providers.tf, variables.tf, main.tf, iam.tf) provisions the AWS resources that host the Cipher
    Codex marketing site: an IAM role and policies, plus the site hosting resources. AWS service nodes
    are marked in AWS orange. The diagram is deliberately honest and small — no invented topology.</desc>

  <defs>
    <marker id="ci-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="ci-arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF9900" stroke="none"/>
    </marker>
  </defs>

  <style>
    .fill-soft { fill: currentColor; fill-opacity:0.06; }
    .lbl { fill: currentColor; stroke: none; }
    .ttl { font-weight:700; }
    .sub { fill: currentColor; fill-opacity:0.65; stroke:none; }
    .lane-lbl { fill: currentColor; fill-opacity:0.55; stroke:none; font-weight:600; letter-spacing:0.08em; }
    .aws { stroke:#FF9900; }
    .aws-fill { fill:#FF9900; fill-opacity:0.10; stroke:#FF9900; }
    .aws-lbl { fill:#FF9900; stroke:none; }
    .conn { stroke:currentColor; stroke-width:1.5; }
    .conn-aws { stroke:#FF9900; stroke-width:1.5; }
    .cloud { fill:none; stroke:#FF9900; stroke-width:1.5; stroke-opacity:0.45; stroke-dasharray:6 5; }
  </style>

  <text x="40" y="50" class="lbl ttl" font-size="26">Cipher Codex — AWS Infrastructure (Terraform)</text>
  <text x="40" y="78" class="sub" font-size="15">A small, honest IaC stack: 4 files provision the site's hosting resources and an IAM role.</text>

  <!-- Body (shifted down to clear the header block) -->
  <g transform="translate(0,48)">
  <!-- ===== Left: Terraform stack ===== -->
  <text x="60" y="128" class="lane-lbl" font-size="12">TERRAFORM STACK · cipher-codex-aws-infra</text>
  <rect x="40" y="150" width="300" height="430" rx="20" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>

  <g font-size="15">
    <rect x="68" y="186" width="244" height="78" rx="12" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="222" text-anchor="middle" class="lbl ttl">providers.tf</text>
    <text x="190" y="246" text-anchor="middle" class="sub" font-size="12">AWS provider + region config</text>

    <rect x="68" y="278" width="244" height="78" rx="12" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="314" text-anchor="middle" class="lbl ttl">variables.tf</text>
    <text x="190" y="338" text-anchor="middle" class="sub" font-size="12">input variables (bucket, domain)</text>

    <rect x="68" y="370" width="244" height="78" rx="12" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="406" text-anchor="middle" class="lbl ttl">main.tf</text>
    <text x="190" y="430" text-anchor="middle" class="sub" font-size="12">site hosting resources</text>

    <rect x="68" y="462" width="244" height="78" rx="12" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="498" text-anchor="middle" class="lbl ttl">iam.tf</text>
    <text x="190" y="522" text-anchor="middle" class="sub" font-size="12">IAM role + access policies</text>
  </g>

  <!-- terraform apply arrow -->
  <path d="M340 365 H460" class="conn" marker-end="url(#ci-arrow)"/>
  <text x="400" y="350" text-anchor="middle" class="sub" font-size="13" font-style="italic">terraform apply</text>
  <text x="400" y="388" text-anchor="middle" class="lane-lbl" font-size="11">PROVISIONS →</text>

  <!-- ===== Right: AWS account cloud ===== -->
  <rect x="480" y="150" width="680" height="430" rx="28" class="cloud"/>
  <text x="510" y="184" class="aws-lbl" font-size="13" font-weight="700" letter-spacing="0.06em">AWS ACCOUNT (us-east-1)</text>

  <!-- IAM (from iam.tf) -->
  <rect x="520" y="408" width="280" height="130" rx="16" class="aws-fill" stroke-width="1.5"/>
  <text x="660" y="446" text-anchor="middle" class="aws-lbl ttl" font-size="17">IAM</text>
  <text x="660" y="474" text-anchor="middle" class="sub" font-size="12.5">Role for site deploy/runtime</text>
  <text x="660" y="496" text-anchor="middle" class="sub" font-size="12.5">+ least-privilege policies</text>
  <text x="660" y="522" text-anchor="middle" class="aws-lbl" font-size="11.5" font-style="italic">defined by iam.tf</text>

  <!-- Site hosting resources (from main.tf) -->
  <rect x="520" y="210" width="600" height="170" rx="16" class="aws-fill" stroke-width="1.5" fill-opacity="0.05"/>
  <text x="540" y="240" class="aws-lbl" font-size="13" font-weight="700" letter-spacing="0.04em">SITE HOSTING RESOURCES · main.tf</text>

  <g font-size="15">
    <rect x="540" y="258" width="170" height="100" rx="14" class="aws-fill" stroke-width="1.5"/>
    <text x="625" y="300" text-anchor="middle" class="aws-lbl ttl">S3 / hosting</text>
    <text x="625" y="324" text-anchor="middle" class="sub" font-size="12">static site bucket</text>

    <rect x="724" y="258" width="170" height="100" rx="14" class="aws-fill" stroke-width="1.5"/>
    <text x="809" y="300" text-anchor="middle" class="aws-lbl ttl">CloudFront</text>
    <text x="809" y="324" text-anchor="middle" class="sub" font-size="12">CDN distribution</text>

    <rect x="908" y="258" width="190" height="100" rx="14" class="aws-fill" stroke-width="1.5"/>
    <text x="1003" y="300" text-anchor="middle" class="aws-lbl ttl">Route 53 / DNS</text>
    <text x="1003" y="324" text-anchor="middle" class="sub" font-size="12">domain → distribution</text>
  </g>

  <!-- connectors: main.tf -> hosting block; iam.tf -> IAM -->
  <path d="M312 405 C 400 405, 420 300, 520 300" class="conn-aws" marker-end="url(#ci-arrow-aws)"/>
  <path d="M312 497 C 400 497, 430 473, 520 473" class="conn-aws" marker-end="url(#ci-arrow-aws)"/>

  <!-- IAM grants hosting -->
  <path d="M660 408 V382" class="conn-aws" stroke-dasharray="4 4" marker-end="url(#ci-arrow-aws)"/>
  <text x="700" y="400" class="sub" font-size="11" font-style="italic">grants access</text>

  <!-- request flow within hosting -->
  <path d="M894 308 H908" class="conn-aws" marker-end="url(#ci-arrow-aws)"/>
  <path d="M710 308 H724" class="conn-aws" marker-end="url(#ci-arrow-aws)"/>

  <!-- Legend -->
  <g font-size="12">
    <rect x="40" y="600" width="540" height="84" rx="14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-opacity="0.4"/>
    <text x="58" y="624" class="lane-lbl" font-size="11">LEGEND</text>
    <rect x="58" y="636" width="22" height="16" rx="4" class="fill-soft" stroke="currentColor" stroke-width="1.5"/>
    <text x="90" y="649" class="sub">Terraform file (IaC source)</text>
    <rect x="280" y="636" width="22" height="16" rx="4" class="aws-fill" stroke-width="1.5"/>
    <text x="312" y="649" class="aws-lbl">AWS service / resource</text>
    <path d="M60 670 H80" class="conn-aws" marker-end="url(#ci-arrow-aws)"/>
    <text x="90" y="674" class="sub">provisions</text>
    <path d="M280 670 H300" class="conn-aws" stroke-dasharray="4 4"/>
    <text x="312" y="674" class="sub">grants access</text>
  </g>
  </g>
</svg>
