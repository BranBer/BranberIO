<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" fill="none"
     font-family="ui-sans-serif, system-ui, sans-serif" role="img"
     aria-labelledby="scrTitle scrDesc">
  <title id="scrTitle">MMA Almanac — scraping pipeline</title>
  <desc id="scrDesc">A Dockerized Python scraping pipeline. External sources Sherdog and UFC are
    collected through Playwright browser automation with Tor IP rotation and a Cloudflare bypass HTTP
    client, parsed and enriched into fighter and fight statistics, then written through Prisma to seed
    PostgreSQL. The pipeline is scheduled by GitHub Actions and EventBridge.</desc>

  <defs>
    <marker id="scrArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
    </marker>
    <marker id="scrArrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #3B5BDB)" />
    </marker>
  </defs>

  <!-- ===== Header band (clears the diagram body below) ===== -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="currentColor">Scrapers — Python Data Collection Pipeline</text>
  <text x="40" y="76" font-size="14" fill="currentColor" opacity="0.7">Dockerized · scheduled via GitHub Actions &amp; EventBridge ·
    <tspan fill="var(--accent, #3B5BDB)" font-weight="600">mma-almanac-scrapers</tspan></text>

  <!-- ===== Diagram body (shifted down to clear the header) ===== -->
  <g transform="translate(0,40)">
    <!-- Stage band labels (top→down conceptual rows, left→right flow) -->
    <g font-size="12" font-weight="700" fill="currentColor" opacity="0.5" letter-spacing="0.08em">
      <text x="60" y="128">SOURCES</text>
      <text x="320" y="128">BROWSER AUTOMATION</text>
      <text x="660" y="128">PARSE &amp; ENRICH</text>
      <text x="980" y="128">PERSIST</text>
    </g>

    <!-- 1. External sources -->
    <g>
      <rect x="60" y="180" width="180" height="70" rx="14" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <text x="150" y="212" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">Sherdog</text>
      <text x="150" y="232" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">fighter profiles</text>
    </g>
    <g>
      <rect x="60" y="290" width="180" height="70" rx="14" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <text x="150" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">UFC</text>
      <text x="150" y="342" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">events / fight stats</text>
    </g>

    <!-- 2. Playwright + Tor + Cloudflare bypass -->
    <g>
      <rect x="320" y="170" width="280" height="270" rx="18" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="460" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">Playwright Automation</text>
      <line x1="344" y1="216" x2="576" y2="216" stroke="currentColor" stroke-width="1" opacity="0.25" />

      <rect x="344" y="232" width="232" height="56" rx="12" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.05" />
      <text x="460" y="255" text-anchor="middle" font-size="14.5" font-weight="600" fill="currentColor">Tor IP rotation</text>
      <text x="460" y="275" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">rotate_tor_ip · human delays</text>

      <rect x="344" y="300" width="232" height="56" rx="12" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.05" />
      <text x="460" y="323" text-anchor="middle" font-size="14.5" font-weight="600" fill="currentColor">Cloudflare bypass</text>
      <text x="460" y="343" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">cloudflare_http_client</text>

      <rect x="344" y="368" width="232" height="52" rx="12" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.05" />
      <text x="460" y="390" text-anchor="middle" font-size="14.5" font-weight="600" fill="currentColor">Session state</text>
      <text x="460" y="409" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">save / load_session_state</text>
    </g>

    <!-- 3. Parsers / enrichers -->
    <g>
      <rect x="660" y="180" width="270" height="125" rx="16" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <text x="795" y="210" text-anchor="middle" font-size="16.5" font-weight="700" fill="currentColor">Parsers</text>
      <line x1="684" y1="224" x2="906" y2="224" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="795" y="248" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.85">fighter stats parser</text>
      <text x="795" y="270" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.85">fight / event stats</text>
      <text x="795" y="292" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.85">strike-by-target SVG</text>
    </g>
    <g>
      <rect x="660" y="320" width="270" height="120" rx="16" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <text x="795" y="350" text-anchor="middle" font-size="16.5" font-weight="700" fill="currentColor">Enrichers</text>
      <line x1="684" y1="364" x2="906" y2="364" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="795" y="388" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.85">external data enricher</text>
      <text x="795" y="410" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.85">name matching · interpolation</text>
    </g>

    <!-- 4. Prisma → PostgreSQL -->
    <g>
      <rect x="980" y="195" width="170" height="80" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="1065" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">Prisma</text>
      <text x="1065" y="250" text-anchor="middle" font-size="12.5" fill="var(--accent, #3B5BDB)" font-weight="600">schema.prisma</text>
      <text x="1065" y="267" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">upsert seeders</text>
    </g>
    <g>
      <rect x="980" y="320" width="170" height="120" rx="14" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <g stroke="currentColor" stroke-width="1.5" fill="none">
        <ellipse cx="1065" cy="358" rx="30" ry="10" />
        <path d="M1035 358 v24 a30 10 0 0 0 60 0 v-24" />
        <path d="M1035 370 a30 10 0 0 0 60 0" />
      </g>
      <text x="1065" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">PostgreSQL</text>
      <text x="1065" y="431" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">seeded data</text>
    </g>

    <!-- Flow arrows -->
    <g stroke="currentColor" stroke-width="2" marker-end="url(#scrArrow)" fill="none">
      <path d="M240 215 q40 0 76 30" />
      <path d="M240 325 q40 0 76 -20" />
      <line x1="600" y1="270" x2="652" y2="245" />
      <line x1="600" y1="350" x2="652" y2="375" />
      <line x1="930" y1="240" x2="972" y2="238" />
      <line x1="930" y1="385" x2="972" y2="382" />
      <line x1="1065" y1="275" x2="1065" y2="312" />
    </g>
    <text x="1085" y="300" font-size="12.5" fill="currentColor" opacity="0.7">seed</text>

    <!-- Scheduling band (accent, bottom) -->
    <rect x="60" y="520" width="1090" height="92" rx="16" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
          stroke-dasharray="6 6" fill="var(--accent, #3B5BDB)" fill-opacity="0.05" />
    <text x="84" y="552" font-size="14" font-weight="700" fill="var(--accent, #3B5BDB)">SCHEDULING &amp; PACKAGING</text>
    <g font-size="14" fill="currentColor" opacity="0.9">
      <rect x="84" y="566" width="200" height="34" rx="10" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="184" y="588" text-anchor="middle" font-weight="600">GitHub Actions</text>
      <rect x="310" y="566" width="200" height="34" rx="10" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="410" y="588" text-anchor="middle" font-weight="600">EventBridge schedule</text>
      <rect x="536" y="566" width="200" height="34" rx="10" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.06" />
      <text x="636" y="588" text-anchor="middle" font-weight="600">Docker image</text>
    </g>
    <line x1="760" y1="583" x2="980" y2="583" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#scrArrowAccent)" />
    <text x="870" y="576" text-anchor="middle" font-size="12.5" fill="var(--accent, #3B5BDB)" font-weight="600">runs the pipeline above</text>

    <!-- Legend -->
    <g font-size="13" fill="currentColor">
      <rect x="60" y="660" width="18" height="14" rx="3" fill="var(--accent, #3B5BDB)" fill-opacity="0.12" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" />
      <text x="86" y="672">Brandon's components</text>
      <rect x="270" y="660" width="18" height="14" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5" />
      <text x="296" y="672">data &amp; external nodes</text>
      <line x1="480" y1="667" x2="510" y2="667" stroke="currentColor" stroke-width="2" marker-end="url(#scrArrow)" />
      <text x="520" y="672">data flow</text>
      <line x1="612" y1="667" x2="642" y2="667" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#scrArrowAccent)" />
      <text x="652" y="672">scheduled trigger</text>
    </g>
  </g>
</svg>
