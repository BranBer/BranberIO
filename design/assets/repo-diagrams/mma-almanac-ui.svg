<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" fill="none"
     font-family="ui-sans-serif, system-ui, sans-serif" role="img"
     aria-labelledby="uiTitle uiDesc">
  <title id="uiTitle">MMA Almanac — consumer web app</title>
  <desc id="uiDesc">The Next.js consumer app. Pages for fight predictions, accuracy tracking, AI
    articles, and fighter stats sit on top of a NextAuth authentication layer and a Prisma data layer
    backed by PostgreSQL. Pages render custom visualization components. Premium predictions are gated
    behind Stripe, and a user profile area provides GDPR data-deletion flows.</desc>

  <defs>
    <marker id="uiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
    </marker>
    <marker id="uiArrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #3B5BDB)" />
    </marker>
  </defs>

  <!-- ===== Header band (clears the diagram body below) ===== -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="currentColor">Web UI — Consumer Next.js Application</text>
  <text x="40" y="76" font-size="14" fill="currentColor" opacity="0.7">App Router · server components ·
    <tspan fill="var(--accent, #3B5BDB)" font-weight="600">mma-almanac-ui</tspan></text>

  <!-- ===== Diagram body (shifted down to clear the header) ===== -->
  <g transform="translate(0,40)">
    <!-- Pages tier -->
    <text x="60" y="120" font-size="12.5" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.06em">PAGES</text>
    <g>
      <rect x="60" y="132" width="250" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="185" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Predictions</text>
      <text x="185" y="184" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">fight cards · head-to-head</text>
    </g>
    <g>
      <rect x="330" y="132" width="250" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="455" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Accuracy</text>
      <text x="455" y="184" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">tracked vs. real results</text>
    </g>
    <g>
      <rect x="600" y="132" width="250" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="725" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Articles</text>
      <text x="725" y="184" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">AI-generated previews</text>
    </g>
    <g>
      <rect x="870" y="132" width="270" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="1005" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Fighter Stats</text>
      <text x="1005" y="184" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">profiles · home insights</text>
    </g>

    <!-- Visualization components (right of pages, render layer) -->
    <g>
      <rect x="870" y="232" width="270" height="120" rx="14" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.06" />
      <text x="1005" y="262" text-anchor="middle" font-size="15.5" font-weight="700" fill="currentColor">Visualizations</text>
      <line x1="894" y1="276" x2="1116" y2="276" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="1005" y="298" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">dual-bar / radar charts</text>
      <text x="1005" y="318" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">performance timeline</text>
      <text x="1005" y="338" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">win-method heatmap</text>
    </g>
    <!-- pages render visualizations -->
    <path d="M1005 206 v22" stroke="currentColor" stroke-width="2" marker-end="url(#uiArrow)" fill="none" />
    <text x="1018" y="222" font-size="12" fill="currentColor" opacity="0.7">render</text>

    <!-- Auth tier -->
    <text x="60" y="262" font-size="12.5" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.06em">AUTH &amp; ACCESS</text>
    <g>
      <rect x="60" y="276" width="240" height="80" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="180" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">NextAuth</text>
      <text x="180" y="330" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">OAuth sessions</text>
      <text x="180" y="348" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">auth-policy guards</text>
    </g>
    <g>
      <rect x="320" y="276" width="240" height="80" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="440" y="304" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Stripe gating</text>
      <text x="440" y="326" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">premium predictions</text>
      <text x="440" y="345" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">locked card · blur placeholder</text>
    </g>
    <g>
      <rect x="580" y="276" width="240" height="80" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="700" y="304" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">User profile</text>
      <text x="700" y="326" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">preferences · linked accounts</text>
      <text x="700" y="345" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">GDPR data-deletion flow</text>
    </g>

    <!-- Data layer -->
    <text x="60" y="412" font-size="12.5" font-weight="700" fill="currentColor" opacity="0.6" letter-spacing="0.06em">DATA LAYER</text>
    <g>
      <rect x="60" y="426" width="300" height="90" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="210" y="460" text-anchor="middle" font-size="16.5" font-weight="700" fill="currentColor">Prisma ORM</text>
      <text x="210" y="484" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">prisma-predictions · articles</text>
      <text x="210" y="503" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">server data access</text>
    </g>
    <g>
      <rect x="390" y="426" width="220" height="90" rx="14" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.06" />
      <g stroke="currentColor" stroke-width="1.5" fill="none">
        <ellipse cx="500" cy="458" rx="30" ry="10" />
        <path d="M470 458 v22 a30 10 0 0 0 60 0 v-22" />
        <path d="M470 470 a30 10 0 0 0 60 0" />
      </g>
      <text x="500" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">PostgreSQL</text>
    </g>

    <!-- Arrows: pages → auth → data -->
    <g stroke="currentColor" stroke-width="2" marker-end="url(#uiArrow)" fill="none">
      <!-- predictions → auth/stripe -->
      <path d="M185 206 v64" />
      <path d="M310 169 q90 0 130 104" />
      <!-- pages → profile -->
      <path d="M455 206 q120 30 230 64" />
      <!-- auth → prisma -->
      <line x1="180" y1="356" x2="195" y2="420" />
      <path d="M440 356 q-120 30 -200 64" />
      <path d="M700 356 q-260 20 -460 64" />
      <!-- prisma → postgres -->
      <line x1="360" y1="471" x2="384" y2="471" />
    </g>
    <text x="120" y="248" font-size="12" fill="var(--accent, #3B5BDB)" font-weight="600">gated by auth →</text>

    <!-- Shared data source note (AI engine writes predictions/articles) -->
    <g>
      <rect x="660" y="430" width="290" height="86" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" stroke-dasharray="6 5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.05" />
      <text x="805" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent, #3B5BDB)">from AI / ML engine</text>
      <text x="805" y="482" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.8">predictions &amp; articles written</text>
      <text x="805" y="500" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.8">into the same PostgreSQL</text>
    </g>
    <path d="M660 472 h-48" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#uiArrowAccent)" fill="none" />

    <!-- Cross-cutting (bottom) -->
    <rect x="60" y="560" width="1080" height="62" rx="14" stroke="currentColor" stroke-width="1.5"
          fill="currentColor" fill-opacity="0.04" />
    <text x="84" y="582" font-size="12.5" font-weight="700" fill="currentColor" opacity="0.6">CROSS-CUTTING</text>
    <g font-size="13.5" fill="currentColor">
      <text x="84" y="606">SSR + loading / error / empty states</text>
      <text x="430" y="606">read-tracking API</text>
      <text x="640" y="606">HTML sanitization</text>
      <text x="850" y="606">health checks · Docker on ECS</text>
    </g>

    <!-- Legend -->
    <g font-size="13" fill="currentColor">
      <rect x="60" y="650" width="18" height="14" rx="3" fill="var(--accent, #3B5BDB)" fill-opacity="0.12" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" />
      <text x="86" y="662">Brandon's app modules</text>
      <rect x="300" y="650" width="18" height="14" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5" />
      <text x="326" y="662">data / shared infra</text>
      <line x1="500" y1="657" x2="530" y2="657" stroke="currentColor" stroke-width="2" marker-end="url(#uiArrow)" />
      <text x="540" y="662">request / data flow</text>
      <line x1="700" y1="657" x2="730" y2="657" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#uiArrowAccent)" />
      <text x="740" y="662">cross-repo data source</text>
    </g>
  </g>
</svg>
