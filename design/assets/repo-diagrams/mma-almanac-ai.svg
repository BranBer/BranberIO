<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" fill="none"
     font-family="ui-sans-serif, system-ui, sans-serif" role="img"
     aria-labelledby="aiTitle aiDesc">
  <title id="aiTitle">MMA Almanac — ML prediction engine</title>
  <desc id="aiDesc">Raw fight and fighter data flows into feature engineering, then into three XGBoost
    models: a win predictor, a method predictor, and a round predictor. Model outputs pass through
    calibration and data-leakage validation, then feed both a prediction API and an OpenAI-powered
    article generator. The engine is deployed on ECS, with retraining and tuning tasks scheduled.</desc>

  <defs>
    <marker id="aiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
    </marker>
    <marker id="aiArrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent, #3B5BDB)" />
    </marker>
  </defs>

  <!-- ===== Header band (clears the diagram body below) ===== -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="currentColor">AI / ML — Fight Prediction Engine</text>
  <text x="40" y="76" font-size="14" fill="currentColor" opacity="0.7">Deployed on ECS · retrain &amp; tune tasks scheduled ·
    <tspan fill="var(--accent, #3B5BDB)" font-weight="600">mma-almanac-ai</tspan></text>

  <!-- ===== Diagram body (shifted down to clear the header) ===== -->
  <g transform="translate(0,40)">
    <!-- 1. Raw data -->
    <g>
      <rect x="50" y="300" width="160" height="120" rx="16" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <g stroke="currentColor" stroke-width="1.5" fill="none">
        <ellipse cx="130" cy="338" rx="28" ry="9" />
        <path d="M102 338 v22 a28 9 0 0 0 56 0 v-22" />
        <path d="M102 349 a28 9 0 0 0 56 0" />
      </g>
      <text x="130" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Raw data</text>
      <text x="130" y="410" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">fight / fighter</text>
    </g>

    <!-- 2. Feature engineering -->
    <g>
      <rect x="270" y="290" width="190" height="140" rx="16" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="365" y="322" text-anchor="middle" font-size="16.5" font-weight="700" fill="currentColor">Feature</text>
      <text x="365" y="343" text-anchor="middle" font-size="16.5" font-weight="700" fill="currentColor">Engineering</text>
      <line x1="294" y1="357" x2="436" y2="357" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="365" y="380" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">fight-pair builder</text>
      <text x="365" y="400" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">cumulative stats</text>
      <text x="365" y="420" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">style features</text>
    </g>

    <!-- 3. Three XGBoost models -->
    <text x="620" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent, #3B5BDB)" letter-spacing="0.06em">3 × XGBOOST MODELS</text>
    <g>
      <rect x="520" y="190" width="200" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="620" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Win predictor</text>
      <text x="620" y="242" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">who wins · probability</text>
    </g>
    <g>
      <rect x="520" y="286" width="200" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="620" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Method predictor</text>
      <text x="620" y="338" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">KO / sub / decision</text>
    </g>
    <g>
      <rect x="520" y="382" width="200" height="74" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="620" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Round predictor</text>
      <text x="620" y="434" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.7">finishing round</text>
    </g>

    <!-- 4. Calibration + leakage validation -->
    <g>
      <rect x="780" y="240" width="190" height="170" rx="16" stroke="currentColor" stroke-width="1.5"
            fill="currentColor" fill-opacity="0.06" />
      <text x="875" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">Calibration</text>
      <text x="875" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">&amp; Validation</text>
      <line x1="804" y1="306" x2="946" y2="306" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="875" y="330" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">probability calibration</text>
      <text x="875" y="352" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">data-leakage tests</text>
      <text x="875" y="374" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">temporal / position</text>
      <text x="875" y="396" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.85">bias analysis</text>
    </g>

    <!-- 5. Outputs: prediction API + article generator -->
    <g>
      <rect x="1010" y="226" width="150" height="92" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="1085" y="258" text-anchor="middle" font-size="15.5" font-weight="700" fill="currentColor">Prediction</text>
      <text x="1085" y="278" text-anchor="middle" font-size="15.5" font-weight="700" fill="currentColor">API</text>
      <text x="1085" y="300" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.7">FastAPI · main.py</text>
    </g>
    <g>
      <rect x="1010" y="334" width="150" height="100" rx="14" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
            fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="1085" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Article</text>
      <text x="1085" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">Generator</text>
      <line x1="1024" y1="398" x2="1146" y2="398" stroke="currentColor" stroke-width="1" opacity="0.25" />
      <text x="1085" y="420" text-anchor="middle" font-size="12.5" fill="currentColor" opacity="0.8">OpenAI-powered</text>
    </g>

    <!-- Flow arrows -->
    <g stroke="currentColor" stroke-width="2" marker-end="url(#aiArrow)" fill="none">
      <line x1="210" y1="360" x2="262" y2="360" />
      <!-- features → three models -->
      <path d="M460 340 q30 -110 56 -113" />
      <path d="M460 360 h52" />
      <path d="M460 380 q30 35 56 38" />
      <!-- models → calibration -->
      <path d="M720 227 q40 0 56 40" />
      <line x1="720" y1="323" x2="776" y2="320" />
      <path d="M720 419 q40 0 56 -30" />
      <!-- calibration → outputs -->
      <path d="M970 300 q22 0 36 -20" />
      <path d="M970 350 q22 0 36 25" />
    </g>

    <!-- Scheduling band (accent) -->
    <rect x="50" y="510" width="1110" height="104" rx="16" stroke="var(--accent, #3B5BDB)" stroke-width="1.5"
          stroke-dasharray="6 6" fill="var(--accent, #3B5BDB)" fill-opacity="0.05" />
    <text x="74" y="542" font-size="14" font-weight="700" fill="var(--accent, #3B5BDB)">SCHEDULED ML WORKFLOWS (ECS tasks)</text>
    <g font-size="14" fill="currentColor">
      <rect x="74" y="556" width="180" height="40" rx="10" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="164" y="581" text-anchor="middle" font-weight="600">retrain</text>
      <rect x="280" y="556" width="180" height="40" rx="10" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" fill="var(--accent, #3B5BDB)" fill-opacity="0.10" />
      <text x="370" y="581" text-anchor="middle" font-weight="600">tune (hyperparams)</text>
      <rect x="486" y="556" width="220" height="40" rx="10" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.06" />
      <text x="596" y="581" text-anchor="middle" font-weight="600">regenerate predictions</text>
    </g>
    <line x1="730" y1="576" x2="900" y2="576" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#aiArrowAccent)" />
    <text x="815" y="568" text-anchor="middle" font-size="12.5" fill="var(--accent, #3B5BDB)" font-weight="600">refresh the models above</text>

    <!-- Legend -->
    <g font-size="13" fill="currentColor">
      <rect x="50" y="660" width="18" height="14" rx="3" fill="var(--accent, #3B5BDB)" fill-opacity="0.12" stroke="var(--accent, #3B5BDB)" stroke-width="1.5" />
      <text x="76" y="672">ML models / Brandon's services</text>
      <rect x="320" y="660" width="18" height="14" rx="3" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5" />
      <text x="346" y="672">data &amp; processing stages</text>
      <line x1="560" y1="667" x2="590" y2="667" stroke="currentColor" stroke-width="2" marker-end="url(#aiArrow)" />
      <text x="600" y="672">data flow</text>
      <line x1="692" y1="667" x2="722" y2="667" stroke="var(--accent, #3B5BDB)" stroke-width="1.75" stroke-dasharray="5 5" marker-end="url(#aiArrowAccent)" />
      <text x="732" y="672">scheduled task</text>
    </g>
  </g>
</svg>
